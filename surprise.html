<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A little greeting</title>
<style>
  :root{
    --paper: #f2e8d5;
    --paper-dark: #e3d3af;
    --ink: #2b2420;
    --wax: #8a3324;
    --wax-dark: #6b2419;
    --gold: #b3893f;
    --sky: #cfe0e8;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--sky);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.4), transparent 45%);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(90vw, 560px);
  }

  .postcard {
    position: relative;
    background: var(--paper);
    background-image: linear-gradient(var(--paper-dark) 1px, transparent 1px);
    background-size: 100% 28px;
    border: 1px solid #d8c7a1;
    border-radius: 4px;
    box-shadow: 0 20px 40px rgba(43,36,32,0.25);
    padding: 56px 44px 44px;
    min-height: 260px;
    color: var(--ink);
    transform: rotate(-1.2deg);
    opacity: 1;
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }

  .postcard.hidden {
    opacity: 0;
    transform: scale(0.82) rotate(-1.2deg);
    pointer-events: none;
  }

  .stamp {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 46px;
    height: 58px;
    border: 2px dashed var(--gold);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--gold);
    transform: rotate(4deg);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .message {
    font-size: 16px;
    line-height: 1.6;
    min-height: 96px;
    white-space: pre-wrap;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    background: var(--ink);
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #7a6b58;
    font-style: italic;
    opacity: 0.9;
  }

  /* Wax seal that covers the card until clicked */
  .seal {
    position: absolute;
    inset: 0;
    background: var(--wax);
    background-image: radial-gradient(circle at 35% 30%, var(--wax) 0%, var(--wax-dark) 75%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.35), 0 12px 24px rgba(0,0,0,0.3);
    transition: transform 0.5s cubic-bezier(.6,-0.28,.74,.05), opacity 0.4s ease;
    z-index: 5;
  }

  .seal::before {
    content: "✦";
    color: rgba(255,255,255,0.85);
    font-size: 38px;
  }

  .seal-label {
    position: absolute;
    bottom: -34px;
    width: 100%;
    text-align: center;
    color: #4a3f36;
    font-size: 13px;
    letter-spacing: 0.3px;
  }

  .seal.opened {
    transform: scale(6) rotate(25deg);
    opacity: 0;
    pointer-events: none;
  }

  /* Growing "click 5 times" button, sits in front of the closed letter */
  .opener {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
  }

  .opener-btn {
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.3px;
    padding: 12px 22px;
    border: none;
    border-radius: 999px;
    background: var(--wax);
    color: #fbeee3;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), font-size 0.3s ease, padding 0.3s ease, background 0.3s ease;
  }

  .opener-btn:hover {
    filter: brightness(1.08);
  }

  .opener.opened {
    transform: scale(3) rotate(20deg);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(.6,-0.28,.74,.05), opacity 0.4s ease;
    pointer-events: none;
  }

  .mood-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .mood {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .mood:hover { transform: scale(1.15); }

  .confetti {
    position: fixed;
    top: 0;
    left: 0;
    width: 8px;
    height: 14px;
    opacity: 0.95;
    pointer-events: none;
    border-radius: 2px;
    will-change: transform, opacity;
  }

  @keyframes explode {
    0% {
      transform: translate(0, 0) rotate(0deg) scale(1);
      opacity: 1;
    }
    70% {
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(var(--end-scale));
      opacity: 0;
    }
  }

  .spark {
    position: fixed;
    top: 0;
    left: 0;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff6df;
    box-shadow: 0 0 6px 2px rgba(255, 246, 223, 0.8);
    pointer-events: none;
    will-change: transform, opacity;
  }

  .confetti-fall {
    position: fixed;
    top: -20px;
    width: 8px;
    height: 14px;
    opacity: 0.85;
    pointer-events: none;
    border-radius: 2px;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  .shockwave {
    position: fixed;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid rgba(255, 246, 223, 0.9);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: shockwave 0.6s ease-out forwards;
  }

  @keyframes shockwave {
    0% {
      width: 20px;
      height: 20px;
      opacity: 0.9;
      border-width: 6px;
    }
    100% {
      width: 340px;
      height: 340px;
      opacity: 0;
      border-width: 0.5px;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="opener" id="opener">
    <button class="opener-btn" id="openerBtn" type="button">Happy Anniversary Ling!!!!! Click to Open me</button>
  </div>

  <div class="postcard hidden" id="postcard">
    <div class="stamp">♡</div>
    <h1>Happy Anniversary Baby!!</h1>
    <div class="message" id="message"><span id="typed"></span><span class="cursor" id="cursor"></span></div>
    <div class="hint">Pili color bb haha</div>
    <div class="mood-row" id="moods"></div>
  </div>
</div>

<script>
  // ---- Config: edit these to personalize ----
  const NAME = "ling";
  const MESSAGES = [
    `Haluu ${NAME}! Im very glad that we reached this milestone sa atong life.`,
    `Im glad that i get to spend this with you my baby. Im also glad nga ikaw akong nakaila and nakaila tika in a very unique time of my life where i needed someone like you`,
    `Happy anniversary baby! I love you so much and i hope that we will be together for a long time. I hope nga magpadayon ta sa atong journey together as a couple and I hope daghan ta ma achieve, ma laagan, ma experience na bag o, ma himo together. I love you baby!`,
  ];
  const MOOD_COLORS = ["#cfe0e8", "#f7d9c4", "#d7e8d4", "#e6d6f2", "#f9e79a"];

  const opener = document.getElementById('opener');
  const openerBtn = document.getElementById('openerBtn');
  const postcard = document.getElementById('postcard');
  const typedEl = document.getElementById('typed');
  const cursorEl = document.getElementById('cursor');
  const moodsEl = document.getElementById('moods');

  // Build mood swatches
  MOOD_COLORS.forEach(color => {
    const dot = document.createElement('div');
    dot.className = 'mood';
    dot.style.background = color;
    dot.addEventListener('click', () => {
      document.body.style.background = color;
    });
    moodsEl.appendChild(dot);
  });

  // Typewriter effect
  function typeText(text, onDone) {
    let i = 0;
    typedEl.textContent = "";
    const interval = setInterval(() => {
      typedEl.textContent += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        if (onDone) onDone();
      }
    }, 50);
  }

  function playGreeting() {
    let idx = 0;
    function next() {
      typeText(MESSAGES[idx], () => {
        idx++;
        if (idx < MESSAGES.length) {
          setTimeout(() => {
            typedEl.textContent += "\n\n";
            next();
          }, 700);
        } else {
          cursorEl.style.display = 'none';
        }
      });
    }
    next();
  }

  // Explosive burst: a shockwave ring, radiating sparks, and confetti
  // that shoot outward from a center point (defaults to viewport center).
  function burstConfetti(originX, originY) {
    const cx = originX ?? window.innerWidth / 2;
    const cy = originY ?? window.innerHeight / 2;
    const colors = ['#8a3324', '#b3893f', '#cfe0e8', '#d7e8d4', '#e6d6f2', '#f9e79a'];

    // Shockwave ring
    const wave = document.createElement('div');
    wave.className = 'shockwave';
    wave.style.left = cx + 'px';
    wave.style.top = cy + 'px';
    document.body.appendChild(wave);
    setTimeout(() => wave.remove(), 650);

    // A second, delayed shockwave for extra punch
    setTimeout(() => {
      const wave2 = document.createElement('div');
      wave2.className = 'shockwave';
      wave2.style.left = cx + 'px';
      wave2.style.top = cy + 'px';
      document.body.appendChild(wave2);
      setTimeout(() => wave2.remove(), 650);
    }, 120);

    // Bright sparks flying outward fast and far
    for (let i = 0; i < 60; i++) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = cx + 'px';
      spark.style.top = cy + 'px';

      const angle = Math.random() * Math.PI * 2;
      const distance = 180 + Math.random() * 260;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;
      const duration = 0.5 + Math.random() * 0.4;

      spark.style.setProperty('--tx', tx + 'px');
      spark.style.setProperty('--ty', ty + 'px');
      spark.style.setProperty('--rot', '0deg');
      spark.style.setProperty('--end-scale', '0.2');
      spark.style.animation = `explode ${duration}s cubic-bezier(.15,.8,.3,1) forwards`;

      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), duration * 1000 + 100);
    }

    // Chunky confetti pieces flying outward, then gravity pulls them down
    for (let i = 0; i < 150; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = cx + 'px';
      piece.style.top = cy + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];

      const angle = Math.random() * Math.PI * 2;
      const distance = 120 + Math.random() * 380;
      const tx = Math.cos(angle) * distance;
      // Bias the vertical spread downward a bit, like gravity catching them mid-flight
      const ty = Math.sin(angle) * distance + 150 + Math.random() * 200;
      const rot = 360 + Math.random() * 900 * (Math.random() < 0.5 ? -1 : 1);
      const duration = 1 + Math.random() * 0.9;

      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.setProperty('--rot', rot + 'deg');
      piece.style.setProperty('--end-scale', (0.5 + Math.random() * 0.6).toString());
      piece.style.animationDelay = (Math.random() * 0.08) + 's';
      piece.style.animation = `explode ${duration}s cubic-bezier(.2,.7,.3,1) forwards`;

      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), duration * 1000 + 200);
    }
  }

  // Gentle ambient confetti that keeps drifting down in the background
  let ambientInterval = null;
  function startAmbientConfetti() {
    if (ambientInterval) return;
    const colors = ['#8a3324', '#b3893f', '#cfe0e8', '#d7e8d4', '#e6d6f2', '#f9e79a'];

    function dropPiece() {
      const piece = document.createElement('div');
      piece.className = 'confetti-fall';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      const duration = 3 + Math.random() * 2;
      piece.style.animation = `fall ${duration}s ease-in forwards`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), duration * 1000 + 200);
    }

    for (let i = 0; i < 6; i++) {
      setTimeout(dropPiece, Math.random() * 800);
    }
    ambientInterval = setInterval(dropPiece, 150);
  }

  function stopAmbientConfetti() {
    clearInterval(ambientInterval);
    ambientInterval = null;
  }

  const CLICK_LABELS = ["Sure naka? ", "Sure njd?", "Really?", "Last chance...", "Okay, mao nani!"];
  let clickCount = 0;

  openerBtn.addEventListener('click', () => {
    if (opener.classList.contains('opened')) return;

    clickCount++;
    const stepIndex = Math.min(clickCount, CLICK_LABELS.length) - 1;
    openerBtn.textContent = CLICK_LABELS[stepIndex];

    const scale = 1 + clickCount * 0.22;
    const fontSize = 15 + clickCount * 3;
    openerBtn.style.transform = `scale(${scale})`;
    openerBtn.style.fontSize = fontSize + 'px';

    if (clickCount >= 5) {
      const rect = openerBtn.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      opener.classList.add('opened');
      postcard.classList.remove('hidden');
      burstConfetti(originX, originY);
      startAmbientConfetti();
      setTimeout(playGreeting, 400);
    }
  });
</script>

</body>
</html>
